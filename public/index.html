<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<title>Blood Network</title>

<!-- Open Graph tags - placeholder content here, rewritten server-side per
     request (site settings / matching multisite brand) by worker.js's
     applyServerSideBranding before this file is served. Crawlers like
     WhatsApp's link-preview bot never execute JS, so these MUST already
     have real values in the HTML response itself - the client-side
     applyBranding() in app.js has no effect on link previews. -->
<meta property="og:title" content="Blood Network" id="ogTitle">
<meta property="og:description" content="রক্তের প্রয়োজনে খুঁজে নিন ডোনারদের" id="ogDescription">
<meta property="og:image" content="" id="ogImage">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image" id="twitterCard">
<link id="faviconLink" rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;700&family=Noto+Sans+Bengali:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script id="lucideScript" src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view" role="main"></main>
</div>

<script src="/js/app.js"></script>
</body>
</html>
